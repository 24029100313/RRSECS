# arguments for dataset
dataset: MMSeg_YREB # Potsdam, Potsdam_woclutter, DeepGlobe, LoveDA, WHU_OPT_SAR, DFC24_T1, Agriculture_Vision, SPARCS, SegMunich
crop_size: 512

# arguments for model
model:
  backbone:
    type: internimage_huge # refer model/model_info.py to select you interesting model
    pretrained: pretrained_weights/imagenet/internimage/internimage_h_jointto22k_384.pth # None: random init
    kwargs:
      in_channels: 3
  decoder:
    type: UPerHead

find_unused_parameters: False # False, True

# arguments for training
epochs: 50
batch_size: 2 # per GPU x 4 GPUs, bs=16

optimizer:
  type: AdamW # SGD, AdamW
  kwargs:
    lr: 0.00006
    weight_decay: 0.05
    lr_multi: 10.0

lr_scheduler:
  type: poly # poly, step, cosine
  kwargs:
    update_type: iter # iter, epoch

criterion:
  type: CELoss  # CELoss, DiceLoss, CombinedLoss, Mask2FormerLoss
  kwargs:
    ignore_index: 255
#    weight_ce: 1.0
#    weight_dice: 3.0
#    smooth_factor: 0.