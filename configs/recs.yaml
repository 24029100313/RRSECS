# arguments for dataset
dataset: RefDIOR_RECS # RefDIOR_RECS, OPT-RSVG_RECS, RRSIS-D_RECS, RefCOCO_RECS
crop_size: 512
strong_aug: True

# arguments for model
model:
  backbone:
    type: swin_tiny # refer model/model_info.py to select you interesting model
    pretrained: imagenet # imagenet, None: random init
    kwargs:
      in_channels: 3
      vlf_ris: CCFormer
#      with_cp: True
  text_encoder:
    type: bert-base-uncased # bert-base-uncased, roberta-base, autotinybert-kd-s4
  decoder:
    type: CCFormerHead # CCFormerHead, MRLNHead, MCNHead, RefTRHead
    kwargs:
      num_classes: 1

find_unused_parameters: True # False, True

# arguments for training
epochs: 50
batch_size: 4 # per GPU x 8 GPUs, bs=32

optimizer:
  type: AdamW # SGD, AdamW
  kwargs:
    lr: 0.00005
    weight_decay: 0.01
    lr_multi: 10.0

lr_scheduler:
  type: poly # poly, step, cosine
  kwargs:
    update_type: iter # iter, epoch

criterion:
  type: RECSLoss
  kwargs:
    aux_loss: True
    weight_ris: 1.0
    weight_vg: 0.1
    # for ris
    weight_bce: 1.0
    weight_bdice: 1.0
    # for vg
    weight_bbox: 5.0
    weight_giou: 2.0