# arguments for dataset
#dataset: QaTa-COV19 # RRSIS-D, RefSegRS, RISBench, Mini-RefDIOR, RefCOCO, RefCOCO+, G-Ref-g, G-Ref-u, QaTa-COV19, MosMedData+
#crop_size: 224

dataset: RRSIS-D # RRSIS-D, RefSegRS, RISBench, RefDIOR, RefCOCO, RefCOCO+, G-Ref-g, G-Ref-u, QaTa-COV19, MosMedData+
crop_size: 512
strong_aug: True

# arguments for model
model:
  backbone:
    type: convnext_tiny # refer model/model_info.py to select you interesting model
    pretrained: imagenet # imagenet, None: random init
    kwargs:
      in_channels: 3
      vlf_ris: CCFormer
#      with_cp: True
  text_encoder:
    type: bert-base-uncased # bert-base-uncased, roberta-base, autotinybert-kd-s4
#    freeze: True
  decoder:
    type: CCFormerRISHead # LAVTHead, CGFormerHead, DMMIHead, CrossVLTHead, LGCEHead, ReMamberHead, MagNetHead, RMSINHead, MCTHead, LGMSHead, RefSegformerHead, ReLAHead
    kwargs:
      num_classes: 1
#      embedding_dim: 256

find_unused_parameters: True # False, True

# arguments for training
epochs: 50
batch_size: 4 # per GPU x 4 GPUs, bs=16

optimizer:
  type: AdamW # SGD, AdamW
  kwargs:
    lr: 0.00005
    weight_decay: 0.01
    lr_multi: 10.0

lr_scheduler:
  type: poly # poly, step, cosine
  kwargs:
    update_type: iter # iter, epoch

criterion:
  type: RISLoss # CELoss, RISLoss, CombinedLoss, SoftBCELoss
  kwargs:
    ignore_index: 255
    weight_bce: 1.0
    weight_bdice: 1.0
#    weight_ce: 1.0
#    weight_dice: 1.0