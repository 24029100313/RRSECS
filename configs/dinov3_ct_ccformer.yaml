# arguments for dataset
dataset: RefDIOR_RIS # RefDIOR_RECS, OPT-RSVG_RECS, RRSIS-D_RECS, RefCOCO_RECS
crop_size: 512

# arguments for model
model:
  backbone:
    type: convnext_tiny # refer model/model_info.py to select you interesting model
    pretrained: dinov3 # imagenet, None: random init
    kwargs:
      in_channels: 3
      vlf_ris: CCFormer
#      with_cp: True
  text_encoder:
    type: bert-base-uncased # bert-base-uncased, roberta-base, autotinybert-kd-s4
  decoder:
    type: CCFormerRISHead # CCFormerHead, MRLNHead, MCNHead, RefTRHead
    kwargs:
      num_classes: 1

find_unused_parameters: True # False, True

# arguments for training
epochs: 50
batch_size: 1 # per GPU x 8 GPUs, bs=32

optimizer:
  type: AdamW # SGD, AdamW
  kwargs:
    lr: 0.00005
    weight_decay: 0.01
    lr_multi: 10.0

lr_scheduler:
  type: poly # poly, step, cosine
  kwargs:
    update_type: iter # iter, epoch

criterion:
  type: RISLoss
  kwargs:
    ignore_index: 255
    weight_bce: 1.0
    weight_bdice: 1.0